# Potluck behind a reverse proxy on the same host. Set POTLUCK_PUBLIC_URL in the environment
# or a .env file next to this file, then `podman compose up -d` or `docker compose up -d`.
services:
  potluck:
    image: ghcr.io/phongguy/potluck:latest
    container_name: potluck
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - potluck-data:/data
    environment:
      POTLUCK_PUBLIC_URL: ${POTLUCK_PUBLIC_URL:?set the URL users reach the server at}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "potluck", "health-check"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  potluck-data:
    # Fixed so compose does not prefix it with the project name; backups name it directly.
    name: potluck-data

[workspace]
members = ["crates/potluck", "crates/potluck-kind"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PhongGuy/potluck"

[workspace.dependencies]
anyhow = "=1.0.104"
apinata-rules = { git = "https://github.com/PhongGuy/apinata", tag = "apinata-rules-v0.1.0" }
argon2 = "=0.6.0"
async-compression = { version = "=0.4.52", features = ["tokio", "gzip"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio", "tracing"] }
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
dbento-rules = { git = "https://github.com/PhongGuy/dbento", tag = "dbento-rules-v0.1.1", version = "0.1" }
futures-util = { version = "=0.3.34", default-features = false }
getrandom = "=0.4.3"
globset = { version = "=0.4.21", default-features = false }
http-body = "=1.1.0"
ipnet = "=2.12.2"
jiff = { version = "=0.2.45", default-features = false, features = ["std"] }
minisign = "=0.10.0"
minisign-verify = "=0.3.0"
openidconnect = { version = "=4.1.0", default-features = false }
prometheus-client = { version = "=0.26.0", default-features = false }
potluck-kind = { path = "crates/potluck-kind" }
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "=0.42.0", features = ["bundled", "backup"] }
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process", "fs"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
subtle = "=2.6.1"
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "io-util", "time", "process", "fs"] }
tokio-util = { version = "=0.7.20", features = ["io-util", "rt"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
url = "=2.5.9"

[patch."https://github.com/PhongGuy/potluck"]
potluck-kind = { path = "crates/potluck-kind" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
ref_option = "warn"
wildcard_imports = "warn"
clone_on_ref_ptr = "warn"
missing_assert_message = "warn"

# Debug info in test builds overflows the CI runner's disk and buys nothing here.
[profile.test]
debug = false

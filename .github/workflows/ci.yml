# The gate on every push to main and every pull request: fmt, clippy and the test suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info and incremental state would overflow the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -Dwarnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Public API
        # rustdoc's JSON output is unstable; RUSTC_BOOTSTRAP lets the stable toolchain emit it.
        run: |
          RUSTC_BOOTSTRAP=1 cargo rustdoc -p potluck --lib --locked -- -Z unstable-options --output-format json
          scripts/check-public-api.sh target/doc/potluck.json
          RUSTC_BOOTSTRAP=1 cargo rustdoc -p potluck-kind --lib --locked -- -Z unstable-options --output-format json
          scripts/check-public-api.sh target/doc/potluck_kind.json

  # Tests each app rules crate pinned in Cargo.lock, in its own repository at the pinned commit.
  # With none pinned it only checks the lock's potluck-kind entry.
  rules:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Rules crates
        run: scripts/rules-crates.sh test Cargo.lock

  # Audits every workflow for injection, credential and pinning mistakes.
  zizmor:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          inputs: .github/workflows
          advanced-security: false

  # Builds the image and runs the smoke test under podman. Not a required check: it informs
  # without blocking, since the gate already covers the code.
  container:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Container smoke test
        run: ENGINE=podman scripts/container-smoke.sh

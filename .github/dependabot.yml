version: 2
updates:
  # Cargo monthly, as one grouped PR.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      cargo:
        patterns:
          - "*"

  # The SHA-pinned actions, monthly, as one grouped PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"

  # The Containerfile's base images, monthly, as one grouped PR.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      docker:
        patterns:
          - "*"

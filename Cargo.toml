[workspace]
members = ["crates/potluck"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PhongGuy/potluck"

[workspace.dependencies]
anyhow = "=1.0.104"
argon2 = "=0.6.0"
async-compression = { version = "=0.4.52", features = ["tokio", "gzip"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
futures-util = { version = "=0.3.34", default-features = false }
getrandom = "=0.4.3"
globset = { version = "=0.4.21", default-features = false }
jiff = { version = "=0.2.45", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
regex = "=1.13.1"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
subtle = "=2.6.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "io-util", "time", "process", "fs"] }
tokio-util = { version = "=0.7.20", features = ["io-util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
url = "=2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
ref_option = "warn"
wildcard_imports = "warn"
clone_on_ref_ptr = "warn"
missing_assert_message = "warn"

# Debug info in test builds overflows the CI runner's disk and buys nothing here.
[profile.test]
debug = false
